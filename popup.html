<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #0f766e;
    }
    p {
      margin: 0 0 12px 0;
      color: #475569;
      line-height: 1.4;
    }
    .status-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      color: #1e293b;
      font-size: 13px;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 11px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      font-size: 13.5px;
    }
    #btn-show-panel {
      background: #10b981;
      color: #ffffff;
    }
    #btn-open-page {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h1>Consulta Pública IBAMA</h1>
  <p>Extensão para envio automatizado de contribuições no Brasil Participativo.</p>
  <div id="status-box" class="status-box">Verificando aba atual...</div>
  <button id="btn-show-panel">Mostrar Painel na Aba</button>
  <button id="btn-open-page">Abrir Página da Consulta</button>
  <script src="popup.js"></script>
</body>
</html>
